<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us </title>
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <p>Have a question or need help? Send us a message and our team will get back to you as soon as possible.</p>
  </header>

  <main>
    <section class="info">
      <article>
        <span class="icon">🏠</span>
        <span class="text">
          <strong>Address</strong><br>
          BTM Khanpur district Rahim Yar khan
        </span>
      </article>

      <article>
        <span class="icon">📞</span>
        <span class="text">
          <strong>Phone</strong><br>
          +92 322-6115806
        </span>
      </article>

      <article>
        <span class="icon">✉️</span>
        <span class="text">
          <strong>Email</strong><br>
          noumanfaiz1016@gmail.com
        </span>
      </article>
    </section>

    <form action="#" method="post">
      <h2>Send Message</h2>

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="Type your message..." required></textarea>

      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
