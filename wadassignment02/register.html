<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register </title>
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <h1>Create your account</h1>
  <p class="subtitle">Join Agri Ai to start your agricultural journey</p>

  <form action="#" method="post">
    <label for="first">First Name</label>
    <input type="text" id="first" name="first_name" placeholder="Enter your first name" required>

    <label for="last">Last Name</label>
    <input type="text" id="last" name="last_name" placeholder="Enter your last name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

    <label for="country">Country</label>
    <select id="country" name="country" required>
      <option value="">Select your country</option>
      <option>Pakistan</option>
      <option>India</option>
      <option>America</option>
      <option>Nigeria</option>
      <option>Saudia</option>
    </select>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Create a strong password" required>

    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" placeholder="Confirm your password" required>

   

    <button type="submit" id="submit" disabled>Register</button>

    <p class="switch">Already have an account? <a href="login.html">Sign in here</a></p>
  </form>

  

   
</body>
</html>
